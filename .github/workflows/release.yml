name: Release
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install build and test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bats
          pipx install clang-format==21.1.8

      - name: build
        run: |
          make release "CFLAGS=-Wall -Wextra -std=c11 -O2 -static"
          mkdir -p _dist
          cp _build/trilog _build/release-posix/libtrilog.a _dist/

      - name: check the version is the tag
        run: test "$(_dist/trilog -V)" = "trilog ${GITHUB_REF_NAME}"

      # The build tests rebuild _build/trilog, so the tests run the copy in _dist.
      - name: test the release binary
        timeout-minutes: 60
        run: make check TRILOG="$PWD/_dist/trilog"

      - name: package
        run: |
          d=trilog-${GITHUB_REF_NAME}-linux-x86_64
          mkdir -p $d/bin $d/lib $d/include
          cp _dist/trilog $d/bin/
          cp _dist/libtrilog.a $d/lib/
          cp include/*.h $d/include/
          cp LICENSE README.md $d/
          tar -czf $d.tar.gz $d
          sha256sum $d.tar.gz > $d.tar.gz.sha256

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "trilog $GITHUB_REF_NAME" --generate-notes \
            trilog-${GITHUB_REF_NAME}-linux-x86_64.tar.gz \
            trilog-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256
